<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gyros — A JavaScript library for creating shiny effects on HTML elements using gyroscope or mouse movement.">
  <title>Gyros — Shiny Effect Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding: 2.5rem 1rem 1rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #ffd700, #f0c500, #e6b200);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      margin-top: 0.5rem;
      font-size: 1.1rem;
      color: #aaa;
      max-width: 480px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 2rem;
      padding: 2rem 1rem;
      max-width: 900px;
      width: 100%;
    }

    .demo-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .gyros-element {
      width: 180px;
      height: 180px;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: box-shadow 0.3s ease;
    }

    .gyros-element:hover {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
    }

    .demo-card span {
      font-size: 0.85rem;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .instructions {
      text-align: center;
      padding: 1rem;
      font-size: 0.95rem;
      color: #888;
    }

    footer {
      margin-top: auto;
      padding: 2rem 1rem;
      text-align: center;
      font-size: 0.85rem;
      color: #666;
    }

    footer a {
      color: #ffd700;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
  <script type="module" crossorigin src="/Gyros/pr-preview/pr-22/assets/index-CTcZ-0L5.js"></script>
</head>
<body>
  <header>
    <h1>✨ Gyros</h1>
    <p>A JavaScript library for creating shiny effects on HTML elements using gyroscope or mouse movement.</p>
  </header>

  <p class="instructions">Move your mouse (or tilt your device) to see the shiny effect in action.</p>

  <div class="demo-grid">
    <div class="demo-card">
      <div class="gyros-element" id="gold-polished"></div>
      <span>Gold · Polished</span>
    </div>
    <div class="demo-card">
      <div class="gyros-element" id="gold-matte"></div>
      <span>Gold · Matte</span>
    </div>
    <div class="demo-card">
      <div class="gyros-element" id="silver-polished"></div>
      <span>Silver · Polished</span>
    </div>
    <div class="demo-card">
      <div class="gyros-element" id="silver-matte"></div>
      <span>Silver · Matte</span>
    </div>
    <div class="demo-card">
      <div class="gyros-element" id="custom-ruby"></div>
      <span>Custom · Ruby</span>
    </div>
    <div class="demo-card">
      <div class="gyros-element" id="custom-emerald"></div>
      <span>Custom · Emerald</span>
    </div>
  </div>

  <footer>
    <p>
      <a href="https://github.com/Primajin/Gyros" target="_blank" rel="noopener">GitHub</a>
      ·
      <a href="https://www.npmjs.com/package/gyros" target="_blank" rel="noopener">npm</a>
    </p>
  </footer>

</body>
</html>
