name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialise with the PR preview workflow so main deploys and preview
# deploys never race to push to the gh-pages branch at the same time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://primajin.github.io/Gyros/
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        run: npm run build:preview
        env:
          VITE_BASE_PATH: /Gyros/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          # Preserve PR preview subdirectories so a main-branch push
          # does not wipe out deployed previews from open PRs.
          clean-exclude: pr-preview
