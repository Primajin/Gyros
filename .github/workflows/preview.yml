name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pages: write
  pull-requests: write

# Use a single shared concurrency group so all runs that write to gh-pages are
# serialised. "preview-${{ github.ref }}" only serialises per PR, which still
# allows concurrent writes from different PRs (or synchronize vs. closed events)
# and causes "remote contains work not present locally" / rebase conflicts.
# cancel-in-progress: false ensures queued runs still execute (important for
# the "closed" event that removes a preview).
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    name: Make sure it builds. Then show a preview.
    environment:
      name: pr-preview/pr-${{ github.event.number }}
      url: ${{ format('https://{0}.github.io/{1}/pr-preview/pr-{2}/', github.repository_owner, github.event.repository.name, github.event.number) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install and Build
        if: github.event.action != 'closed'
        run: |
          npm ci
          npm run build:preview
        env:
          VITE_BASE_PATH: /Gyros/pr-preview/pr-${{ github.event.number }}/

      - name: Configure GitHub Pages for branch deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' | \
          gh api repos/${{ github.repository }}/pages \
            --method PATCH \
            --input - \
            || true

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        id: preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          source-dir: ./dist/
