name: "CI · Console"

on:
  workflow_call:

jobs:
  console:
    runs-on: ubuntu-latest
    name: Get console logs
    permissions:
      contents: read
      pull-requests: write # post the console-log report as a PR comment
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for the preview
        uses: Primajin/.github/actions/wait-for-url@v1
        with:
          url: ${{ env.PREVIEW_URL }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use WebApp Console Log Action
        uses: Primajin/webapp-console-log-action@v2.0.0
        with:
          webapp-url: ${{ env.PREVIEW_URL }}
          regexp-error: 'Failed \D+ 404 \(\)'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
