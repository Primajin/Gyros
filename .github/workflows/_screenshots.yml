name: "CI · Screenshots"

on:
  workflow_call:

jobs:
  screenshots:
    runs-on: ubuntu-latest
    name: Take a screenshot after page was built
    permissions:
      contents: write # upload the screenshots as release assets
      pull-requests: write # post the screenshots as a PR comment
    env:
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
    steps:
      - name: Wait for the preview
        uses: Primajin/.github/actions/wait-for-url@v1
        with:
          url: ${{ env.PREVIEW_URL }}
      - name: Checkout code
        uses: actions/checkout@v7
      - name: screenshots-ci-action
        uses: Primajin/screenshots-ci-action@v4
        with:
          devices: iPhone 13,iPad Pro 11,iPad Pro 11 landscape
          full-page: false
          no-desktop: true
          release-id: 315671617
          type: png
          url: ${{ env.PREVIEW_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          path: screenshots
          name: Download-screenshots
