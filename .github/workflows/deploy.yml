name: "Deploy"

on:
  push:
    branches: [ main ]

permissions:
  contents: write

# Use a single shared concurrency group so all runs that write to gh-pages are
# serialised. A per-ref group still allows concurrent writes from different
# triggers and causes rebase conflicts on the gh-pages branch.
# cancel-in-progress: false ensures queued runs still execute.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy the latest main version to GitHub Pages.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      - name: Install dependencies
        run: npm ci
      - name: Run build
        run: npm run build:preview
        env:
          VITE_BASE_PATH: "/Gyros/"
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          retry_on_conflict: true
